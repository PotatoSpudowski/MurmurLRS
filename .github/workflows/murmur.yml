name: Murmur encrypted checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crypto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run all crypto and acquisition tests
        run: make -C src/lib/MurmurEncrypt test

  ota-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install platformio==6.1.19
      - name: Test build-time key provisioning
        run: python -m unittest discover -s src/python/tests -p 'test_murmur_key.py'
      - name: Test production OTA hooks and experimental session core
        working-directory: src
        env:
          MURMUR_BINDING_PHRASE: ci-only-not-a-secret
        run: pio test -e native_murmur
      - name: Sanitize session parser, framing, and handshake
        working-directory: src
        run: |
          g++ -std=c++11 -O1 -g -DMURMUR_ENCRYPT -DMURMUR_SESSION_STANDALONE \
            -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer \
            -Ilib/MurmurSession -I.pio/libdeps/native_murmur/Unity/src \
            test/test_murmur_session/test_session.cpp lib/MurmurSession/MurmurSession.cpp \
            lib/MurmurSession/vendor/SHA256.cpp lib/MurmurSession/vendor/Hash.cpp \
            lib/MurmurSession/vendor/Crypto.cpp .pio/libdeps/native_murmur/Unity/src/unity.c \
            -o /tmp/murmur-session-tests
          /tmp/murmur-session-tests

  encrypted-firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - Unified_ESP32_2400_TX_via_WIFI
          - Unified_ESP32_LR2021_TX_via_WIFI
          - Unified_ESP32_LR1121_RX_via_WIFI
          - Unified_ESP8285_2400_TX_via_WIFI
          - Murmur_LilyGO_T3S3_LR1121_TX_via_UART
          - Murmur_LilyGO_T3S3_LR1121_RX_via_UART
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19
      - uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: murmur-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('src/targets/*.ini') }}
      - name: Compile the encrypted path
        working-directory: src
        env:
          PLATFORMIO_BUILD_FLAGS: '-DMURMUR_ENCRYPT -DRegulatory_Domain_FCC_915'
          MURMUR_BINDING_PHRASE: ci-only-not-a-secret
          MURMUR_BENCH_FREERUN: '1'
        run: pio run -e "${{ matrix.target }}"
